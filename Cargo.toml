[package]
name = "rpi-ihaveadhd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ADHD-friendly output rules plugin for rpi"
repository = "https://github.com/morler/rpi-ihaveadhd"
homepage = "https://github.com/morler/rpi-ihaveadhd"
readme = "README.md"
keywords = ["rpi", "plugin", "adhd", "prompt"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = "0.21"
serde_json = "1"
